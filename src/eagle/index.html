<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Eagle</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="app-shell">
      <div class="sky-background" aria-hidden="true"></div>

      <header class="top-bar">
        <div class="title-block">
          <h1>
            <span>Tab Eagle</span>
            <img class="title-logo" src="/icons/icon128.png" alt="" aria-hidden="true" />
          </h1>
          <p id="tab-count">Loading tabs...</p>
        </div>

        <md-outlined-text-field
          id="tab-search"
          class="tab-search"
          type="search"
          placeholder="Search"
          aria-label="Search tabs by title or URL"
        >
          <svg slot="leading-icon" class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/>
          </svg>
        </md-outlined-text-field>

        <div class="toolbar">
          <md-outlined-segmented-button-set class="sort-control" aria-label="Sort tabs">
            <md-outlined-segmented-button label="Position" data-sort="position" selected></md-outlined-segmented-button>
            <md-outlined-segmented-button label="Domain" data-sort="domain"></md-outlined-segmented-button>
            <md-outlined-segmented-button label="Recent" data-sort="recent"></md-outlined-segmented-button>
          </md-outlined-segmented-button-set>

          <md-outlined-button id="return-origin" type="button" hidden>Return to origin</md-outlined-button>
        </div>
      </header>

      <section id="status" class="status" role="status" aria-live="polite"></section>
      <section id="tab-grid" class="tab-grid" role="grid" aria-label="Tabs"></section>
    </main>
  </body>
</html>
